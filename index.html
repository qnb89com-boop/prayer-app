<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المواقيت – الزاب الأسفل</title>
<style>
:root{--bg:#1e2236;--cd:#28304a;--pl:#3b4863;--sl:#3d4a66;--rd:#d1494d;--tx:#eef1f8;--mu:#7e8aa8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg)}
body{margin:auto;max-width:560px;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;padding:14px 16px 100px}
button,input,select,textarea{font:inherit}
.pill{display:flex;align-items:center;background:var(--pl);border-radius:40px;padding:8px 22px 8px 8px;width:86%;margin:6px auto 18px}
.pill span{flex:1;text-align:center;font-size:16px}
.rf{width:44px;height:44px;border-radius:50%;border:0;background:var(--rd);display:grid;place-items:center;color:#fff}
.hero{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.l{font-size:18px;color:#d6dbea}.nm{font-size:54px;font-weight:700;color:var(--rd);line-height:1.2}
.cd{font-size:60px;font-weight:800;text-align:center;direction:ltr;margin:0 0 22px;font-variant-numeric:tabular-nums}
.dt{display:flex;align-items:center;gap:12px;color:#dde2f0;font-size:16px;margin-bottom:4px;text-align:center}
.dt::before,.dt::after{content:"";flex:1;height:2px;background:#8f9aad}
.src{text-align:center;font-size:12px;color:var(--mu);margin-bottom:14px}
.pr{display:flex;justify-content:space-between;align-items:center;padding:0 22px;height:54px;border-radius:18px;margin-bottom:11px;font-size:20px;border:2px solid transparent}
.ps{background:var(--sl);color:#dfe5f5}.fu{border-color:#e8ecf5}.dm{border-color:var(--pl);color:var(--mu)}
.nx{background:linear-gradient(#cc4d4f,#963636);font-weight:700}
.nv{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;display:flex;background:var(--bg);border-top:1px solid var(--pl);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.nv button{flex:1;background:none;border:0;color:#9aa5c0;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.nv button.on{color:#e05a5a}
.nv svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--cd);border:1px solid var(--pl);border-radius:16px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--pl);border-radius:10px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
textarea{height:130px;direction:ltr;font-family:monospace}
.btn{padding:10px 14px;border:0;border-radius:12px;background:var(--rd);color:#fff;margin-inline-end:6px}.btn.g{background:var(--sl)}
.hint{font-size:12px;color:var(--mu);line-height:1.8}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0}.chk input{width:auto;margin:0}
.t{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;direction:ltr;text-align:center}
td,th{padding:5px;border-bottom:1px solid var(--pl)}tr.today{background:var(--sl)}
#bn{display:none;background:var(--rd);padding:12px;border-radius:12px;margin-bottom:12px;text-align:center}
</style>
</head>
<body>
<div id="bn"></div>
<section id="a">
<div class="pill"><span>ناحية الزاب الأسفل, العراق</span>
<button class="rf" id="rf" aria-label="تحديث"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14-4M4 5v3h3M4 13a8 8 0 0 0 14 4M20 19v-3h-3"/></svg></button></div>
<div class="hero">
<div><div class="l">بقي على</div><div class="nm" id="nn">--</div></div>
<svg viewBox="0 0 120 120" width="128" height="128"><circle cx="60" cy="60" r="52" fill="none" stroke="#38405a" stroke-width="6"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="#d1494d" stroke-width="6" stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="0 327"/><circle id="dot" r="8" fill="#d1494d" cx="60" cy="8"/><g id="ic" transform="translate(60 60)" stroke="#d1494d" fill="#d1494d"></g></svg>
</div>
<div class="cd" id="cd">00:00:00</div>
<div class="dt" id="dt"></div>
<div class="src" id="src"></div>
<div id="list"></div>
</section>

<section id="b" hidden>
<div class="card">
<label>الشهر</label><input type="month" id="mon">
<label>الصق جدول الشهر (سطر لكل يوم)</label>
<textarea id="paste" placeholder="1 04:21 05:49 11:52 15:08 17:55 19:15&#10;2 04:22 05:50 11:52 15:07 17:54 19:14"></textarea>
<button class="btn" id="save">حفظ الشهر</button><button class="btn g" id="clr">مسح الشهر</button>
<p class="hint">الترتيب: الفجر، الشروق، الظهر، العصر، المغرب، العشاء. رقم اليوم في بداية السطر اختياري. يقبل نظام 12 ساعة والأرقام العربية واللصق من Excel.</p>
</div>
<div class="card t" id="prev"></div>
</section>

<section id="c" hidden>
<div class="card">
<label>خط العرض</label><input id="lat" type="number" step="0.0001">
<label>خط الطول</label><input id="lng" type="number" step="0.0001">
<label>طريقة الحساب</label>
<select id="met"><option value="mwl">رابطة العالم الإسلامي (18° / 17°)</option><option value="egy">الهيئة المصرية (19.5° / 17.5°)</option><option value="kar">كراتشي (18° / 18°)</option></select>
<div class="chk"><input type="checkbox" id="onl"><label for="onl">استخدام الإنترنت عند عدم وجود إدخال يدوي</label></div>
<div class="chk"><input type="checkbox" id="h12"><label for="h12">عرض الوقت بنظام 12 ساعة (ص / م)</label></div>
<label>التنبيه قبل الصلاة بـ (دقائق)</label><input id="bef" type="number" min="0" max="60">
<div id="nl"></div>
<button class="btn" id="perm">تفعيل التنبيهات</button><button class="btn" id="sv2">حفظ</button>
<p class="hint">الأولوية: الإدخال اليدوي، ثم الإنترنت، ثم الحساب التلقائي. الإحداثيات تقريبية للزاب الأسفل.</p>
</div>
</section>

<nav class="nv">
<button class="on" data-t="a"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>المواقيت</button>
<button data-t="b"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>إدخال الشهر</button>
<button data-t="c"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>الإعدادات</button>
</nav>

<script>
const N=["الفجر","الشروق","الظهر","العصر","المغرب","العشاء"],$=s=>document.querySelector(s);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let cfg=Object.assign({lat:35.4,lng:43.65,met:"mwl",onl:true,bef:0,h12:true,nt:[1,0,1,1,1,1]},ld("cfg",{}));
const M={mwl:[18,17,3],egy:[19.5,17.5,5],kar:[18,18,1]};
const p2=n=>String(n).padStart(2,"0");
const mk=d=>d.getFullYear()+"-"+p2(d.getMonth()+1);
const hm=h=>{let m=Math.round(((h%24)+24)%24*60);return p2(Math.floor(m/60)%24)+":"+p2(m%60)};
const toMin=s=>{const[a,b]=s.split(":");return +a*60+ +b};
const fromMin=m=>p2(Math.floor(m/60)%24)+":"+p2(m%60);
const fmt=s=>{if(!cfg.h12)return s;let[h,m]=s.split(":").map(Number);const x=h>=12?"م":"ص";h=h%12||12;return h+":"+p2(m)+" "+x};
const R=Math.PI/180,sn=x=>Math.sin(x*R),cs=x=>Math.cos(x*R);
function calc(dt){
 const d=Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate(),12)/864e5+2440587.5-2451545;
 const g=(357.529+0.98560028*d)%360,q=(280.459+0.98564736*d)%360;
 const L=q+1.915*sn(g)+0.02*sn(2*g),e=23.439-4e-7*d;
 let ra=Math.atan2(cs(e)*sn(L),cs(L))/R/15;ra=((ra%24)+24)%24;
 const D=Math.asin(sn(e)*sn(L))/R,eq=q/15-ra;
 const Z=12+3-cfg.lng/15-(((eq+12)%24+24)%24-12);
 const t=a=>Math.acos((-sn(a)-sn(D)*sn(cfg.lat))/(cs(D)*cs(cfg.lat)))/R/15;
 const [fa,ia]=M[cfg.met];
 const aa=-Math.atan(1/(1+Math.tan(Math.abs(cfg.lat-D)*R)))/R;
 const ta=Math.acos((sn(aa)-sn(D)*sn(cfg.lat))/(cs(D)*cs(cfg.lat)))/R/15;
 return[Z-t(fa),Z-t(0.833),Z,Z+ta,Z+t(0.833),Z+t(ia)].map(hm);
}
const manual=d=>{const m=ld("pt:"+mk(d),null);return m&&m[d.getDate()]||null};
async function online(d){
 const c=new AbortController(),to=setTimeout(()=>c.abort(),5000);
 try{
  const u=`https://api.aladhan.com/v1/timings/${p2(d.getDate())}-${p2(d.getMonth()+1)}-${d.getFullYear()}?latitude=${cfg.lat}&longitude=${cfg.lng}&method=${M[cfg.met][2]}&timezonestring=Asia/Baghdad`;
  const j=await(await fetch(u,{signal:c.signal})).json(),T=j.data.timings;
  return["Fajr","Sunrise","Dhuhr","Asr","Maghrib","Isha"].map(k=>T[k].slice(0,5));
 }catch(e){return null}finally{clearTimeout(to)}
}
async function getT(d){
 const m=manual(d);if(m)return{t:m,s:"إدخال يدوي"};
 if(cfg.onl&&navigator.onLine){const o=await online(d);if(o)return{t:o,s:"أونلاين"}}
 return{t:calc(d),s:"حساب تلقائي"};
}
let today=null,dayKey="",fired={},tom=null;
function hijri(){
 try{return new Intl.DateTimeFormat("ar-u-ca-islamic-umalqura-nu-latn",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date()).replace(/\s?هـ$/,"").replace("،",",")}
 catch(e){return new Date().toLocaleDateString("ar",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
}
async function refresh(){
 const now=new Date();dayKey=now.toDateString();today=await getT(now);
 $("#src").textContent="المصدر: "+today.s;$("#dt").textContent=hijri();draw();
}
const O=[0,2,3,4,5];
function nextIdx(){const n=new Date(),nm=n.getHours()*60+n.getMinutes();return O.find(i=>toMin(today.t[i])>nm)}
function draw(){
 if(!today)return;const nx=nextIdx(),T=today.t,n=new Date(),nm=n.getHours()*60+n.getMinutes();
 const rows=[[0,N[0],T[0]],[2,N[2],T[2]],[3,N[3],T[3]],[4,N[4],T[4]],[5,N[5],T[5]]];
 $("#list").innerHTML=rows.map(([i,nme,t,dm,ap])=>{
  const c=dm?"dm":i===nx?"nx":toMin(t)<=nm?"ps":"fu";
  return`<div class="pr ${c}"><span>${nme}</span><span>${ap?"≈ ":""}${fmt(t)}</span></div>`}).join("");
}
const SUN='<circle r="9" stroke="none"/>'+[0,1,2,3,4,5,6,7].map(k=>`<line y1="-15" y2="-21" stroke-width="3" stroke-linecap="round" transform="rotate(${k*45})"/>`).join("");
const MOON='<path d="M-6,-14 A16,16 0 1,0 14,6 A12,12 0 0,1 -6,-14Z" stroke="none"/>';
async function tick(){
 if(new Date().toDateString()!==dayKey){await refresh();tom=null}
 if(!today)return;
 const now=new Date(),nm=now.getHours()*60+now.getMinutes(),ns=nm*60+now.getSeconds();
 const nx=nextIdx();let tgt,pv,name;
 if(nx!==undefined){tgt=toMin(today.t[nx])*60;name=N[nx];const k=O.indexOf(nx);pv=k?toMin(today.t[O[k-1]])*60:(toMin(today.t[5])-1440)*60}
 else{if(!tom){tom=(await getT(new Date(Date.now()+864e5))).t}tgt=toMin(tom[0])*60+86400;name=N[0];pv=toMin(today.t[5])*60}
 const df=Math.max(0,tgt-ns),f=Math.min(1,Math.max(0,(ns-pv)/(tgt-pv))),C=2*Math.PI*52,a=(f*360-90)*R;
 $("#nn").textContent=name;
 $("#cd").textContent=p2(Math.floor(df/3600))+":"+p2(Math.floor(df%3600/60))+":"+p2(df%60);
 $("#arc").setAttribute("stroke-dasharray",f*C+" "+C);
 $("#dot").setAttribute("cx",60+52*Math.cos(a));$("#dot").setAttribute("cy",60+52*Math.sin(a));
 $("#ic").innerHTML=(nx>=2&&nx<=4)?SUN:MOON;
 cfg.nt.forEach((on,i)=>{
  if(!on)return;const tm=toMin(today.t[i])-cfg.bef,k=dayKey+i;
  if(nm>=tm&&nm<tm+2&&!fired[k]){fired[k]=1;notify(i)}
 });
 draw();
}
function notify(i){
 const msg=cfg.bef>0?`بعد ${cfg.bef} دقيقة: صلاة ${N[i]}`:`حان الآن موعد ${N[i]}`;
 const b=$("#bn");b.textContent="🔔 "+msg;b.style.display="block";setTimeout(()=>b.style.display="none",60000);
 try{if(Notification.permission==="granted")new Notification("مواقيت الصلاة",{body:msg})}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
}
document.querySelectorAll(".nv button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".nv button").forEach(x=>x.classList.toggle("on",x===b));
 ["a","b","c"].forEach(id=>$("#"+id).hidden=id!==b.dataset.t);
});
$("#rf").onclick=()=>{tom=null;refresh()};
const dig=s=>s.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٫：]/g,":");
$("#mon").value=mk(new Date());
function preview(){
 const m=ld("pt:"+$("#mon").value,null);
 if(!m){$("#prev").innerHTML='<span class="hint">لا توجد بيانات محفوظة لهذا الشهر.</span>';return}
 const td=new Date(),isM=$("#mon").value===mk(td);
 $("#prev").innerHTML="<table><tr><th>يوم</th>"+N.map(n=>`<th>${n}</th>`).join("")+"</tr>"+
 Object.keys(m).sort((a,b)=>a-b).map(d=>`<tr class="${isM&&+d===td.getDate()?"today":""}"><td>${d}</td>${m[d].map(x=>`<td>${fmt(x)}</td>`).join("")}</tr>`).join("")+"</table>";
}
$("#mon").onchange=preview;
$("#save").onclick=()=>{
 const out={};let seq=1;
 dig($("#paste").value).split(/\n/).forEach(line=>{
  const ts=line.match(/\d{1,2}:\d{2}/g);if(!ts||ts.length<6)return;
  const t=ts.slice(-6);
  const head=line.slice(0,line.indexOf(ts[0])).match(/\d+/);
  const day=head?+head[0]:seq;seq=day+1;
  out[day]=t.map((x,i)=>{let[h,m]=x.split(":").map(Number);if(i>=3&&h<12)h+=12;return p2(h)+":"+p2(m)});
 });
 const n=Object.keys(out).length;
 if(!n){alert("لم يتم التعرف على أي سطر. تأكد من وجود 6 أوقات في كل سطر.");return}
 sv("pt:"+$("#mon").value,out);alert("تم حفظ "+n+" يوم");preview();refresh();
};
$("#clr").onclick=()=>{if(confirm("مسح بيانات هذا الشهر؟")){localStorage.removeItem("pt:"+$("#mon").value);preview();refresh()}};
$("#lat").value=cfg.lat;$("#lng").value=cfg.lng;$("#met").value=cfg.met;$("#onl").checked=cfg.onl;$("#h12").checked=cfg.h12;$("#bef").value=cfg.bef;
$("#nl").innerHTML=N.map((n,i)=>`<div class="chk"><input type="checkbox" class="nc" id="n${i}" ${cfg.nt[i]?"checked":""}><label for="n${i}">تنبيه ${n}</label></div>`).join("");
$("#perm").onclick=async()=>{try{const r=await Notification.requestPermission();alert(r==="granted"?"تم تفعيل التنبيهات":"لم يتم السماح بالتنبيهات")}catch(e){alert("المتصفح لا يدعم التنبيهات")}};
$("#sv2").onclick=()=>{
 cfg={lat:+$("#lat").value,lng:+$("#lng").value,met:$("#met").value,onl:$("#onl").checked,h12:$("#h12").checked,bef:+$("#bef").value||0,nt:[...document.querySelectorAll(".nc")].map(c=>c.checked?1:0)};
 sv("cfg",cfg);fired={};tom=null;refresh();preview();alert("تم الحفظ");
};
preview();refresh();setInterval(tick,1000);
</script>
</body>
</html>
